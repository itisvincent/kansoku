<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kansoku</title>
    <script>
      // Before anything paints: the boot screen and the app start in the saved theme.
      try {
        if (localStorage.getItem('kansoku.theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (error) {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0a;
        color: #e8e8e8;
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f4f4f5;
        color: #18181b;
        color-scheme: light;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/train-entry.tsx"></script>
  </body>
</html>
