name: desktop-windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

concurrency:
  group: desktop-windows
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: project overlays
        run: pnpm overlay:sync

      - name: package Windows app
        run: pnpm --filter @kansoku/desktop package:win

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kansoku-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip

      - name: attach artifacts to the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            gh release view $env:RELEASE_TAG *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          if ($LASTEXITCODE -ne 0) { throw "Release $env:RELEASE_TAG was not created in time" }
          gh release upload $env:RELEASE_TAG apps/desktop/release/*.exe apps/desktop/release/*.zip --clobber
